<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobile Chat App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h1>Welcome</h1>
                <div id="auth-tabs">
                    <button id="signin-tab" class="tab-button active">Sign In</button>
                    <button id="signup-tab" class="tab-button">Sign Up</button>
                </div>
                
                <!-- Sign In Form -->
                <form id="signin-form" class="auth-form active">
                    <input type="email" id="signin-email" placeholder="Email" required>
                    <input type="password" id="signin-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Sign In</button>
                    <button type="button" id="forgot-password-btn" class="btn-link">Forgot Password?</button>
                </form>
                
                <!-- Sign Up Form -->
                <form id="signup-form" class="auth-form">
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                
                <!-- Confirmation Form -->
                <form id="confirm-signup-form" class="auth-form">
                    <input type="text" id="confirmation-code" placeholder="Confirmation Code" required>
                    <button type="submit" class="btn-primary">Confirm</button>
                </form>
                
                <!-- Forgot Password Form -->
                <form id="forgot-password-form" class="auth-form">
                    <input type="email" id="forgot-email" placeholder="Email" required>
                    <button type="submit" class="btn-primary">Send Reset Code</button>
                </form>
                
                <!-- Reset Password Form -->
                <form id="reset-password-form" class="auth-form">
                    <input type="text" id="reset-code" placeholder="Reset Code" required>
                    <input type="password" id="new-password" placeholder="New Password" required>
                    <button type="submit" class="btn-primary">Reset Password</button>
                </form>
            </div>
        </div>
        
        <!-- Main App Screen -->
        <div id="main-screen" class="screen">
            <div class="header">
                <h1>Chat</h1>
                <div class="header-actions">
                    <button id="assessments-btn" class="btn-icon">📋</button>
                    <button id="profile-btn" class="btn-icon">👤</button>
                    <button id="signout-btn" class="btn-icon">🚪</button>
                </div>
            </div>
            
            <div class="main-content">
                <!-- Chat List -->
                <div id="chat-list" class="chat-list">
                    <button id="new-chat-btn" class="btn-primary">New Chat</button>
                    <div id="conversations"></div>
                </div>
                
                <!-- Chat Interface -->
                <div id="chat-interface" class="chat-interface">
                    <div class="chat-header">
                        <button id="back-to-list" class="btn-icon">←</button>
                        <span id="chat-title">Select a conversation</span>
                        <div class="chat-actions">
                            <button id="archive-chat" class="btn-icon">📁</button>
                            <button id="delete-chat" class="btn-icon">🗑️</button>
                        </div>
                    </div>
                    <div id="messages" class="messages"></div>
                    <div class="message-input">
                        <input type="text" id="message-text" placeholder="Type a message...">
                        <button id="send-message" class="btn-primary">Send</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Assessment Screen -->
        <div id="assessment-screen" class="screen">
            <div class="header">
                <button id="back-to-main" class="btn-icon">←</button>
                <h1>Assessments</h1>
            </div>
            <div id="assessments-list" class="assessments-list"></div>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
        </div>
        
        <!-- Error Toast -->
        <div id="error-toast" class="toast error hidden"></div>
        
        <!-- Success Toast -->
        <div id="success-toast" class="toast success hidden"></div>
    </div>
    
    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/assessment.js"></script>
</body>
</html>
